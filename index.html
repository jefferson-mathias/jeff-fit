<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jeff Fit">
<meta name="theme-color" content="#000">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text y='.85em' font-size='72' x='14'>🏋️</text></svg>">
<title>Jeff Fit</title>
<style>
/* ─── RESET ─────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none}
html{height:100%;overflow:hidden}
body{
  height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:-apple-system,'Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;
  /* Prevent rubber-band scroll on body */
  position:fixed;width:100%;
}
input,textarea,button,select{font-family:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
textarea{resize:none}
::-webkit-scrollbar{display:none}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* ─── LAYOUT CONTAINER ──────────────────────────────────────── */
/* Root wrapper: full height minus tab bar */
#app{
  position:absolute;
  top:0;left:0;right:0;
  bottom:calc(49px + env(safe-area-inset-bottom));
  overflow:hidden;
}

/* Each screen fills #app exactly, scrolls internally */
.screen{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  overflow-y:scroll;
  -webkit-overflow-scrolling:touch;
  /* Hidden: shift off-screen to the right */
  transform:translateX(100%);
  /* No transition by default — instant switch */
  visibility:hidden;
  background:#000;
}
.screen.active{
  transform:translateX(0);
  visibility:visible;
}

/* ─── TAB BAR ───────────────────────────────────────────────── */
#tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:calc(49px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(18,18,18,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:.5px solid rgba(255,255,255,.12);
  display:flex;
  z-index:9999;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;
  color:#636366;font-size:10px;font-weight:500;
  /* Larger touch target */
  padding:6px 0 2px;
  transition:color .15s;
  /* Prevent text selection on double-tap */
  -webkit-user-select:none;user-select:none;
}
.tab.active{color:#30d158}
.tab svg{
  width:24px;height:24px;fill:none;
  stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}

/* ─── DESIGN TOKENS ─────────────────────────────────────────── */
:root{
  --g1:#1c1c1e;--g2:#2c2c2e;--g3:#3a3a3c;--g4:#48484a;
  --g5:#636366;--g6:#8e8e93;--g7:#aeaeb2;
  --accent:#30d158;
  --accent-bg:rgba(48,209,88,.12);
  --accent-brd:rgba(48,209,88,.25);
  --blue:#0a84ff;--blue-bg:rgba(10,132,255,.12);
  --red:#ff453a;--red-bg:rgba(255,69,58,.12);
  --amber:#ff9f0a;--amber-bg:rgba(255,159,10,.12);
  --sep:rgba(255,255,255,.1);
  --r:12px;--r2:10px;
}

/* ─── SAFE HEADER ───────────────────────────────────────────── */
.safe-hdr{
  padding-top:calc(env(safe-area-inset-top) + 12px);
  background:#000;
  position:sticky;top:0;z-index:100;
}
.hdr-bar{
  display:flex;align-items:center;
  padding:0 16px 10px;
  border-bottom:.5px solid var(--sep);
}
.hdr-title{font-size:17px;font-weight:600}
.large-title{
  font-size:34px;font-weight:700;
  letter-spacing:-.5px;
  padding:8px 16px 12px;
  border-bottom:.5px solid var(--sep);
}

/* ─── SECTIONS ──────────────────────────────────────────────── */
.section{margin:28px 16px 0}
.section-label{
  font-size:13px;color:var(--g6);
  padding-bottom:6px;
  text-transform:uppercase;letter-spacing:.3px;
}
.group{
  background:var(--g1);
  border-radius:var(--r);
  overflow:hidden;
}
.cell{
  display:flex;align-items:center;
  padding:12px 16px;min-height:44px;
  position:relative;
  /* Active state */
  -webkit-user-select:none;
}
.cell:active{background:var(--g2)}
.cell+.cell::before{
  content:'';position:absolute;top:0;left:16px;right:0;
  height:.5px;background:var(--sep);
}
.cell-icon{
  width:30px;height:30px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;margin-right:12px;
}
.cell-body{flex:1;min-width:0}
.cell-title{font-size:17px;color:#fff}
.cell-sub{font-size:13px;color:var(--g6);margin-top:1px}
.cell-right{
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;margin-left:8px;
}
.cell-chev svg{
  width:13px;height:13px;fill:none;stroke:var(--g5);
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
}

/* check circle */
.chk{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--g4);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{
  width:12px;height:12px;fill:none;
  stroke:#000;stroke-width:2.8;
  stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transition:opacity .15s;
}
.chk.on svg{opacity:1}

/* disclosure */
.disc{overflow:hidden;max-height:0;transition:max-height .28s ease}
.disc.open{max-height:1400px}
.disc-inner{
  padding:10px 16px 14px;
  border-top:.5px solid var(--sep);
}
.disc-item{
  font-size:15px;color:var(--g7);
  padding:3px 0;line-height:1.55;
  display:flex;gap:8px;
}
.disc-item::before{content:'·';color:var(--accent);flex-shrink:0}
.disc-opt{
  margin-top:10px;padding:9px 12px;
  border-radius:9px;background:var(--blue-bg);
  font-size:13px;color:var(--blue);line-height:1.5;
}

/* ─── HOME ──────────────────────────────────────────────────── */
.home-hero{
  padding-top:calc(env(safe-area-inset-top) + 16px);
  padding-bottom:20px;
  padding-left:20px;padding-right:20px;
  background:#000;
}
.hero-time{font-size:13px;color:var(--g6);margin-bottom:4px}
.hero-name{font-size:28px;font-weight:700;letter-spacing:-.4px}
.hero-date{font-size:13px;color:var(--g5);margin-top:5px}

.workout-card{
  margin:0 16px;
  background:var(--g1);
  border-radius:var(--r);overflow:hidden;
}
.wc-inner{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
}
.wc-icon{font-size:28px;flex-shrink:0}
.wc-body{flex:1;min-width:0}
.wc-label{font-size:11px;color:var(--g6);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.wc-name{font-size:16px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-meta{font-size:13px;color:var(--g6);margin-top:2px}
.wc-chev svg{
  width:14px;height:14px;fill:none;stroke:var(--g5);
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
}
.wc-bar{height:3px;background:var(--g3)}
.wc-fill{height:100%;background:var(--accent);
  border-radius:1.5px;transition:width .4s ease}

/* week */
.week-row{display:flex;gap:6px}
.wd{
  flex:1;background:var(--g1);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;
  padding:7px 0;gap:5px;
}
.wd-n{font-size:9px;color:var(--g6);font-weight:500;text-transform:uppercase}
.wd-dot{width:5px;height:5px;border-radius:50%;background:var(--g3)}
.wd.done .wd-dot{background:var(--accent)}
.wd.today .wd-n{color:var(--accent)}

/* stats */
.stats-row{display:flex;gap:10px}
.sbox{
  flex:1;background:var(--g1);border-radius:var(--r2);
  padding:12px 10px;
}
.sbox-val{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1}
.sbox-lbl{font-size:11px;color:var(--g6);margin-top:3px}

/* water */
.water-bar{height:6px;background:var(--g3);border-radius:3px;overflow:hidden;margin-bottom:14px}
.water-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .35s ease}
.quick-btns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.qbtn{
  padding:7px 13px;border-radius:20px;
  background:var(--g2);color:var(--g7);
  font-size:13px;font-weight:500;
}
.qbtn:active{background:var(--g3)}
.custom-row{display:flex;gap:8px;align-items:center}
.w-input{
  flex:1;background:var(--g2);border:none;border-radius:8px;
  padding:9px 12px;color:#fff;font-size:15px;outline:none;
}
.w-btn{
  padding:9px 14px;border-radius:8px;
  background:var(--blue);color:#fff;
  font-size:14px;font-weight:600;
}
.w-btn:active{opacity:.75}
.w-rst{
  padding:9px 12px;border-radius:8px;
  background:var(--g2);color:var(--g6);font-size:13px;
}
.w-rst:active{background:var(--g3)}

/* home meals mini list */
.home-meal-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;min-height:44px;position:relative;
}
.home-meal-row+.home-meal-row::before{
  content:'';position:absolute;top:0;left:16px;right:0;
  height:.5px;background:var(--sep);
}
.hm-icon{font-size:18px;flex-shrink:0}
.hm-body{flex:1}
.hm-name{font-size:15px;color:#fff}
.hm-time{font-size:12px;color:var(--g6);margin-top:1px}

/* ─── TREINO ────────────────────────────────────────────────── */
.split-tabs{
  display:flex;gap:6px;padding:10px 16px;
  overflow-x:auto;scrollbar-width:none;
  background:#000;
  position:sticky;
  top:calc(env(safe-area-inset-top) + 44px);
  z-index:50;
  border-bottom:.5px solid var(--sep);
  -webkit-overflow-scrolling:touch;
}
.split-tabs::-webkit-scrollbar{display:none}
.stab{
  flex-shrink:0;padding:6px 14px;border-radius:20px;
  background:var(--g2);color:var(--g7);
  font-size:14px;font-weight:500;
  transition:all .15s;
  -webkit-user-select:none;
  white-space:nowrap;
}
#treino-body{
  overflow:hidden;
  width:100%;
}
.stab.active{background:var(--accent);color:#000;font-weight:700}
.stab:active{opacity:.75}

.treino-panel{display:none;padding-bottom:32px}
.treino-panel.active{display:block}

.tp-hdr{
  margin:14px 16px 0;padding:14px;
  background:var(--g1);border-radius:var(--r);
}
.tp-eye{font-size:11px;color:var(--g6);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.tp-name{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:12px}
.mark-btn{
  width:100%;padding:11px;border-radius:10px;
  font-size:15px;font-weight:600;
  background:var(--accent);color:#000;
}
.mark-btn.done{background:var(--g2);color:var(--g6)}
.mark-btn:active{opacity:.75}

.note-wrap{margin:10px 16px 0}
.note-ta{
  width:100%;background:var(--g1);border:none;
  border-radius:var(--r2);padding:10px 14px;
  color:#fff;font-size:15px;min-height:44px;
  line-height:1.5;outline:none;
}
.note-ta::placeholder{color:var(--g5)}

/* exercise card */
.ex-card{
  margin:10px 16px 0;background:var(--g1);
  border-radius:var(--r);overflow:hidden;
}
.ex-hdr{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;cursor:pointer;
  -webkit-user-select:none;
}
.ex-hdr:active{background:var(--g2)}
.ex-thumb{
  width:52px;height:52px;border-radius:9px;
  overflow:hidden;background:#fff;flex-shrink:0;
}
.ex-thumb svg{width:52px;height:52px;display:block}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-vol{font-size:12px;color:var(--g6);margin-top:2px}
.ex-tag{
  display:inline-block;margin-top:4px;
  font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500;
}
.tag-a{background:var(--amber-bg);color:var(--amber)}
.tag-p{background:var(--accent-bg);color:var(--accent)}
.tag-c{background:var(--blue-bg);color:var(--blue)}
.tag-k{background:var(--red-bg);color:var(--red)}
.ex-moves{display:flex;flex-direction:column;gap:3px;flex-shrink:0;margin-left:2px}
.mv{
  width:24px;height:24px;border-radius:6px;
  background:var(--g2);color:var(--g6);font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.mv:active{background:var(--g3)}
.ex-chev{color:var(--g5);margin-left:2px;flex-shrink:0;transition:transform .2s}
.ex-chev.open{transform:rotate(180deg)}
.ex-chev svg{
  width:13px;height:13px;fill:none;stroke:currentColor;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
}

/* exercise body */
.ex-body{display:none;border-top:.5px solid var(--sep)}
.ex-body.open{display:block}
.ex-vis{
  background:#fff;margin:12px 12px 0;
  border-radius:10px;overflow:hidden;
  display:flex;justify-content:center;
}
.ex-vis svg{width:100%;max-width:280px;display:block}
.ex-chips{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px 0}
.mchip{
  font-size:11px;padding:3px 8px;border-radius:20px;
  background:var(--red-bg);color:var(--red);font-weight:500;
}
.ex-steps{padding:10px 12px}
.step{
  display:flex;gap:10px;padding:6px 0;
  border-bottom:.5px solid var(--sep);align-items:flex-start;
}
.step:last-child{border-bottom:none}
.step-n{
  min-width:18px;height:18px;border-radius:50%;
  background:var(--g2);color:var(--accent);
  font-size:9px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
}
.step-t{font-size:14px;color:var(--g7);line-height:1.5}

.ex-series{padding:10px 12px;border-top:.5px solid var(--sep)}
.ex-series-lbl{
  font-size:11px;color:var(--g6);text-transform:uppercase;
  letter-spacing:.3px;font-weight:500;margin-bottom:8px;
}
.sdots{display:flex;gap:8px;flex-wrap:wrap}
.sdot{
  width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--g3);background:var(--g2);
  font-size:12px;font-weight:600;color:var(--g6);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.sdot:active{opacity:.75}
.sdot.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

.ex-load{padding:10px 12px;border-top:.5px solid var(--sep)}
.ex-load-lbl{
  font-size:11px;color:var(--g6);text-transform:uppercase;
  letter-spacing:.3px;font-weight:500;margin-bottom:8px;
}
.load-f{
  width:100%;background:var(--g2);border:none;
  border-radius:8px;padding:9px 12px;
  color:#fff;font-size:15px;font-weight:500;outline:none;
}
.load-f::placeholder{color:var(--g5)}

.ex-timer{padding:10px 12px;border-top:.5px solid var(--sep)}
.timer-btn{
  width:100%;padding:10px;border-radius:10px;
  background:var(--g2);color:var(--g7);
  font-size:14px;font-weight:600;
  border:.5px solid var(--g3);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s,color .2s;
}
.timer-btn.running{background:var(--amber-bg);color:var(--amber)}
.timer-btn.done2{background:var(--accent-bg);color:var(--accent)}
.timer-btn:active{opacity:.75}

/* ─── PROGRESSO ─────────────────────────────────────────────── */
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--g1);border-radius:var(--r2);padding:14px}
.pcard-v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1}
.pcard-l{font-size:12px;color:var(--g6);margin-top:4px}

.wi-row{display:flex;gap:8px;margin-top:10px}
.wi{
  flex:1;background:var(--g2);border:none;
  border-radius:10px;padding:11px 14px;
  color:#fff;font-size:17px;outline:none;
}
.wi::placeholder{color:var(--g5)}
.wi-s{
  padding:11px 18px;border-radius:10px;
  background:var(--accent);color:#000;
  font-size:15px;font-weight:600;
}
.wi-s:active{opacity:.75}

.mini-chart{height:56px;width:100%;margin:10px 0 4px;position:relative}
.mini-chart canvas{position:absolute;inset:0}

.wrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:.5px solid var(--sep);
}
.wrow:last-child{border-bottom:none}
.wdate{font-size:13px;color:var(--g6)}
.wval{font-size:16px;font-weight:600}
.wdiff{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
.dn{background:var(--accent-bg);color:var(--accent)}
.dp{background:var(--red-bg);color:var(--red)}

.sec-title{
  font-size:13px;color:var(--g6);
  text-transform:uppercase;letter-spacing:.3px;
  font-weight:400;padding-bottom:4px;
  border-bottom:.5px solid var(--sep);margin-bottom:4px;
}
.lrow{
  display:flex;justify-content:space-between;
  padding:8px 0;border-bottom:.5px solid var(--sep);
}
.lrow:last-child{border-bottom:none}
.lrow-n{font-size:15px;color:#fff}
.lrow-v{font-size:15px;color:var(--accent);font-weight:600}
.nrow{padding:9px 0;border-bottom:.5px solid var(--sep)}
.nrow:last-child{border-bottom:none}
.nrow-m{font-size:11px;color:var(--g6);margin-bottom:2px}
.nrow-t{font-size:14px;color:var(--g7);line-height:1.5}
.trow{
  padding:9px 0;border-bottom:.5px solid var(--sep);
  font-size:14px;color:var(--g7);
  display:flex;align-items:center;gap:8px;
}
.trow:last-child{border-bottom:none}
.empty{padding:20px 0;text-align:center;color:var(--g5);font-size:14px}

/* backup */
.bkp-btn{
  width:100%;padding:13px;border-radius:10px;
  background:var(--g2);color:var(--g7);
  font-size:15px;font-weight:500;
  display:flex;align-items:center;gap:10px;
}
.bkp-btn:active{background:var(--g3)}
.bkp-btn+.bkp-btn{margin-top:8px}

/* spacer */
.pb{padding-bottom:32px}
</style>
</head>
<body>

<!-- APP CONTAINER -->
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="s-home">
    <div class="home-hero">
      <div class="hero-time" id="h-time">Bom dia</div>
      <div class="hero-name">Jeff Mathias</div>
      <div class="hero-date" id="h-date"></div>
    </div>

    <!-- treino de hoje -->
    <div style="margin:0 16px 0">
      <div class="workout-card" onclick="goToTreino()">
        <div class="wc-inner">
          <div class="wc-icon" id="wc-icon">🏋️</div>
          <div class="wc-body">
            <div class="wc-label">Treino de hoje</div>
            <div class="wc-name" id="wc-name">—</div>
            <div class="wc-meta" id="wc-meta"></div>
          </div>
          <div class="wc-chev"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
        <div class="wc-bar"><div class="wc-fill" id="wc-fill" style="width:0%"></div></div>
      </div>
    </div>

    <!-- semana -->
    <div class="section">
      <div class="section-label">Esta semana — <span id="h-streak"></span></div>
      <div class="week-row" id="h-week"></div>
    </div>

    <!-- resumo -->
    <div class="section">
      <div class="section-label">Resumo</div>
      <div class="stats-row" id="h-stats"></div>
    </div>

    <!-- água -->
    <div class="section">
      <div class="section-label">Hidratação — <span id="h-wlbl">0 / 3000 ml</span></div>
      <div class="group" style="padding:12px 16px">
        <div class="water-bar"><div class="water-fill" id="h-wbar" style="width:0%"></div></div>
        <div class="quick-btns" id="h-qbtns"></div>
        <div class="custom-row">

  const prevTab    = document.getElementById(prev.tab);
  if (prevScreen) { prevScreen.classList.remove('active'); }
  if (prevTab)    { prevTab.classList.remove('active'); }

  // show next
  currentTab = id;
  const next = TABS[id];
  const nextScreen = document.getElementById(next.screen);
  const nextTab    = document.getElementById(next.tab);
  if (nextScreen) {
    nextScreen.classList.add('active');
    // Force Safari repaint
    nextScreen.style.display = 'none';
    // eslint-disable-next-line no-unused-expressions
    nextScreen.offsetHeight; // trigger reflow
    nextScreen.style.display = '';
  }
  if (nextTab) { nextTab.classList.add('active'); }

  // render content on demand
  if (id === 'home')     renderHome();
  if (id === 'dieta')    renderDieta();
  if (id === 'progress') renderProg();
}

const DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const SPLIT_ORDER = ['A','B','C','D'];

// Returns which split should be done today based on last completed
function getNextSplit() {
  const t = getTraining();
  // Find the last day a split was completed (any key with _A, _B, _C, _D)
  const splitKeys = Object.keys(t)
    .filter(k => /\d{4}-\d{2}-\d{2}_[ABCD]$/.test(k) && t[k])
    .sort();
  if (!splitKeys.length) {
    // No history — suggest A
    return 'A';
  }
  const lastKey = splitKeys[splitKeys.length - 1];
  const lastSplit = lastKey.slice(-1); // 'A','B','C','D'
  const lastDate  = lastKey.slice(0,10);
  // If already did one today, show what's done today
  const todaySplitKey = splitKeys.find(k => k.startsWith(todayStr()+'_'));
  if (todaySplitKey) return todaySplitKey.slice(-1);
  // Otherwise return next in sequence
  const idx = SPLIT_ORDER.indexOf(lastSplit);
  return SPLIT_ORDER[(idx + 1) % SPLIT_ORDER.length];
}

const load = (k, d) => {
  try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d; }
  catch(e) { return d; }
};
const store = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch(e) {

      const o = load('jf3_o', {});

  }
};

// ── TIMER ─────────────────────────────────────────────────────────
let _tInt = null, _tBtn = null, _tEnd = null, _tSecs = 0;

// Request notification permission on first timer use
function requestNotifPerm() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function runTimer(secs, btn) {
  // Cancel any running timer
  if (_tInt) { clearInterval(_tInt); _tInt = null; }
  if (_tBtn && _tBtn !== btn) {
    _tBtn.className = 'timer-btn';
    _tBtn.innerHTML = _tBtn._orig || '▶ Descanso';
  }
  _tBtn = btn; btn._orig = btn.innerHTML;
  if (!secs) return;
  _tSecs = secs;
  _tEnd = Date.now() + secs * 1000;
  requestNotifPerm();

  // Schedule notification at end (works even when screen locked on some browsers)
  scheduleNotif(secs);

  const tick = () => {
    const remaining = Math.max(0, Math.ceil((_tEnd - Date.now()) / 1000));
    const m = Math.floor(remaining/60), s = remaining % 60;
    btn.className = 'timer-btn running';
    btn.innerHTML = `⏱ ${m>0 ? m+'m ':''} ${String(s).padStart(2,'0')}s`;
    if (remaining <= 0) {
      clearInterval(_tInt); _tInt = null;
      btn.className = 'timer-btn done2';
      btn.innerHTML = '✓ Pronto!';
      try { navigator.vibrate([300,100,300,100,300]); } catch(e) {}
      showNotif();
      setTimeout(() => { btn.className = 'timer-btn'; btn.innerHTML = btn._orig; }, 3000);
    }
  };
  tick(); _tInt = setInterval(tick, 500); // 500ms for accuracy
}

let _notifTimeout = null;
function scheduleNotif(secs) {
  if (_notifTimeout) clearTimeout(_notifTimeout);
  if (!('Notification' in window)) return;
  _notifTimeout = setTimeout(() => {
    showNotif();
  }, secs * 1000);
}
function showNotif() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    try {
      new Notification('Jeff Fit — Descanso concluído! 💪', {
        body: 'Hora de continuar o treino.',
        icon: 'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><text y=\'.9em\' font-size=\'90\'>🏋️</text></svg>',
        tag: 'jf-timer',
        renotify: true,
      });
    } catch(e) {}
  }
}

// Re-sync timer when page becomes visible again (after lock/tab switch)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && _tEnd && _tInt) {
    // Timer is running — tick immediately to sync display
    if (_tBtn) {
      const remaining = Math.max(0, Math.ceil((_tEnd - Date.now()) / 1000));
      if (remaining <= 0) {
        clearInterval(_tInt); _tInt = null;
        _tBtn.className = 'timer-btn done2';
        _tBtn.innerHTML = '✓ Pronto!';
        setTimeout(() => { if(_tBtn){_tBtn.className='timer-btn';_tBtn.innerHTML=_tBtn._orig;} }, 3000);
      }
    }
  }
});

// ── CHART ─────────────────────────────────────────────────────────
function drawChart(id) {
  const wgs = getWeights(); if (wgs.length < 2) return;
  const canvas = document.getElementById(id); if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.offsetWidth || 300, H = 56;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  const vals = wgs.slice(-10).map(w => w.v);
  const mn = Math.min(...vals) - 1, mx = Math.max(...vals) + 1;
  const px = i => 4 + (W-8)*i/(vals.length-1);
  const py = v => H - 4 - (H-8)*(v-mn)/(mx-mn);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, 'rgba(48,209,88,.22)'); g.addColorStop(1, 'rgba(48,209,88,0)');
  ctx.beginPath(); ctx.moveTo(px(0), py(vals[0]));
  vals.forEach((v,i) => { if(i) ctx.lineTo(px(i), py(v)); });
  ctx.lineTo(px(vals.length-1), H); ctx.lineTo(px(0), H); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(px(0), py(vals[0]));
  vals.forEach((v,i) => { if(i) ctx.lineTo(px(i), py(v)); });
  ctx.strokeStyle = '#30d158'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();
  vals.forEach((v,i) => {
    ctx.beginPath(); ctx.arc(px(i), py(v), 3, 0, Math.PI*2);
    ctx.fillStyle = '#30d158'; ctx.fill();
  });
}

  if (weekEl) {
    let wHtml = '', cnt = 0;
    for (let i = 0; i < 7; i++) {
      const dd = new Date(); dd.setDate(dd.getDate() - dd.getDay() + i);

    const dd = new Date(); dd.setDate(dd.getDate()-dd.getDay()+i);

  const mlDisp = avgMl >= 1000 ? (avgMl/1000).toFixed(1)+'L' : avgMl+'ml';

  if (icEl)   icEl.textContent  = sp.emoji;

function toggleExBody(id, hdr) {
  const b = document.getElementById(id); if (!b) return;
  b.classList.toggle('open');
  const ch = hdr ? hdr.querySelector('.ex-chev') : null;
  if (ch) ch.classList.toggle('open');
}
function toggleSerie(key, ei, si) {
  const sr = getSeries(), sk = todayStr()+'_s_'+key+'_'+ei;
  if (!sr[sk]) sr[sk] = [];
  sr[sk][si] = !sr[sk][si];
  store('jf3_s', sr);
  const sp = SPLITS[key];
  const o = getOrder(), ok = todayStr()+'_o_'+key;
  const exList = o[ok] || sp.ex.map((_,i)=>i);
  const pos = exList.indexOf(ei);
  const old = document.getElementById('ec-'+key+'-'+ei);
  if (!old) return;
  // Check if all series now done
  const updatedDa = sr[sk] || [];
  const allNowDone = sp.ex[ei].s > 0 && updatedDa.filter(Boolean).length === sp.ex[ei].s;
  const nw = buildExCard(key, ei, sp.ex[ei], pos, exList.length);
  old.replaceWith(nw);
  if (allNowDone) {
    // Auto-close this card and open next exercise
    const nextPos = pos + 1;
    if (nextPos < exList.length) {
      const nextEi = exList[nextPos];
      const nextCard = document.getElementById('ec-'+key+'-'+nextEi);
      if (nextCard) {
        const nb = nextCard.querySelector('.ex-body');
        const nch = nextCard.querySelector('.ex-chev');
        if (nb) nb.classList.add('open');
        if (nch) nch.classList.add('open');
        // Smooth scroll to next card
        setTimeout(() => nextCard.scrollIntoView({behavior:'smooth', block:'start'}), 100);
      }
    }
  } else {
    // Keep current card open
    const b = nw.querySelector('.ex-body'); if (b) b.classList.add('open');
    const ch = nw.querySelector('.ex-chev'); if (ch) ch.classList.add('open');
  }
  renderHome();
}
function saveLoad(key, ei, val) { const l=getLoads(); l[key+'_'+ei]=val; store('jf3_l',l); }
function saveNote(key, val)     { const n=getNotes(); n[todayStr()+'_n_'+key]=val; store('jf3_n',n); }
function mvEx(key, pos, dir) {
  const sp = SPLITS[key], o = getOrder(), ok = todayStr()+'_o_'+key;
  const exList = [...(o[ok] || sp.ex.map((_,i)=>i))];
  const np = pos + dir;
  if (np < 0 || np >= exList.length) return;
  [exList[pos], exList[np]] = [exList[np], exList[pos]];
  o[ok] = exList; store('jf3_o', o);
  const oldP = document.getElementById('tp-'+key);
  if (oldP) oldP.replaceWith(buildPanel(key, sp, true));
}
function switchSplit(key, btn) {
  document.querySelectorAll('.treino-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('active'));
  const panel = document.getElementById('tp-'+key);
  if (panel) panel.classList.add('active');
  if (btn) { btn.classList.add('active'); btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
}
function markDone(key, btn) {
  const t = getTraining(), k = todayStr()+'_'+key, done = !!t[k];
  t[k] = !done; if (!done) t[todayStr()] = true; store('jf3_t', t);
  if (btn) { btn.className='mark-btn'+(done?'':' done'); btn.textContent=done?'Marcar como concluído':'✓ Concluído'; }
  renderHome();
}

// ── PROGRESS ──────────────────────────────────────────────────────
function savePeso() {
  const inp = document.getElementById('wi'); if (!inp) return;
  const val = parseFloat(inp.value);
  if (!val || val < 40 || val > 200) return;
  const w = getWeights(); w.push({d:todayStr(), v:val}); store('jf3_kg', w);
  inp.value = ''; renderProg(); setTimeout(()=>drawChart('wc'), 80);
}

function renderProg() {
  const pb = document.getElementById('prog-body'); if (!pb) return;
  const wgs = getWeights(), t = getTraining(), l = getLoads(), n = getNotes();
  const lastW  = wgs.length ? wgs[wgs.length-1].v : 79;
  const firstW = wgs.length ? wgs[0].v : 79;
  const diff   = (lastW - firstW).toFixed(1);
  const tdays  = Object.keys(t).filter(k=>!k.includes('_')).length;
  let streak = 0, d2 = new Date();
  while (true) { const dk=d2.toISOString().slice(0,10); if(t[dk]){streak++;d2.setDate(d2.getDate()-1);}else break; }
  const diffNeg = parseFloat(diff) <= 0;
  const diffHtml = wgs.length > 1
    ? `<span class="wdiff ${diffNeg?'dn':'dp'}">${parseFloat(diff)>0?'+':''}${diff}kg</span>` : '—';

  // weight history rows
  const wHistHtml = wgs.length
    ? [...wgs].reverse().slice(0,8).map((w,i,a)=>{
        const prev=a[i+1]; const d3=prev?(w.v-prev.v).toFixed(1):null;
        return `<div class="wrow">
          <span class="wdate">${w.d}</span>
          <div style="display:flex;align-items:center">
            ${d3!=null?`<span class="wdiff ${parseFloat(d3)<=0?'dn':'dp'}">${parseFloat(d3)>0?'+':''}${d3}kg</span>`:''}
            <span class="wval" style="margin-left:6px">${w.v} kg</span>
          </div>
        </div>`;
      }).join('')
    : '<div class="empty">Nenhum registro ainda</div>';

  // loads
  const lEntries = Object.entries(SPLITS).flatMap(([sk,sp])=>
    sp.ex.map((e,ei)=>({sk,name:e.n,val:l[sk+'_'+ei]})).filter(e=>e.val)
  );
  let lHtml = lEntries.length ? '' : '<div class="empty">Nenhuma carga registrada</div>';
  if (lEntries.length) {
    const byK = {}; lEntries.forEach(e=>{if(!byK[e.sk])byK[e.sk]=[];byK[e.sk].push(e);});
    lHtml = Object.entries(byK).map(([k,es])=>`
      <div class="sec-title">Treino ${k} — ${SPLITS[k].nome}</div>
      ${es.map(e=>`<div class="lrow"><span class="lrow-n">${e.name}</span><span class="lrow-v">${e.val}</span></div>`).join('')}
    `).join('');
  }

  // notes
  const nEs = Object.entries(n).filter(([,v])=>v&&v.trim()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,8);
  const nHtml = nEs.length
    ? nEs.map(([k,v])=>{const p=k.split('_n_');return`<div class="nrow"><div class="nrow-m">${p[0]} · Treino ${p[1]||''}</div><div class="nrow-t">${v}</div></div>`;}).join('')
    : '<div class="empty">Nenhuma observação ainda</div>';

  // training days
  const tdList = Object.keys(t).filter(k=>!k.includes('_')).sort().reverse().slice(0,10);
  const tHtml = tdList.length
    ? tdList.map(d=>`<div class="trow">✅ ${d}</div>`).join('')
    : '<div class="empty">Nenhum treino registrado</div>';

  pb.innerHTML = `
    <div class="section">
      <div class="prog-grid">
        <div class="pcard"><div class="pcard-v" style="color:#30d158">${lastW}</div><div class="pcard-l">kg atual</div></div>
        <div class="pcard"><div class="pcard-v" style="font-size:22px">${diffHtml}</div><div class="pcard-l">variação total</div></div>
        <div class="pcard"><div class="pcard-v" style="color:#0a84ff">${tdays}</div><div class="pcard-l">treinos</div></div>
        <div class="pcard"><div class="pcard-v" style="color:#ff9f0a">${streak}</div><div class="pcard-l">sequência</div></div>
      </div>
    </div>
    <div class="section">
      <div class="section-label">Peso</div>
      <div class="group" style="padding:14px 16px">
        <div class="wi-row"><input class="wi" type="number" id="wi" placeholder="79.5" step="0.1"><button class="wi-s" onclick="savePeso()">Salvar</button></div>
        <div class="mini-chart"><canvas id="wc"></canvas></div>
        ${wHistHtml}
      </div>
    </div>
    <div class="section">
      <div class="section-label">Cargas</div>
      <div class="group" style="padding:0 16px">${lHtml}</div>
    </div>
    <div class="section">
      <div class="section-label">Observações</div>
      <div class="group" style="padding:0 16px">${nHtml}</div>
    </div>
    <div class="section">
      <div class="section-label">Dias treinados</div>
      <div class="group" style="padding:0 16px">${tHtml}</div>
    </div>
    <div class="section">
      <div class="section-label">Backup</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="bkp-btn" onclick="exportBackup()">📤 Exportar dados (.json)</button>
        <button class="bkp-btn" onclick="document.getElementById('imp').click()">📥 Restaurar backup</button>
        <input type="file" id="imp" accept=".json" style="display:none" onchange="importBackup(this)">
      </div>
    </div>
    <div class="pb"></div>`;
  setTimeout(()=>drawChart('wc'), 80);
}

// ── INIT ──────────────────────────────────────────────────────────
function init() {
  renderHome();
  renderDieta();
  initTreino();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
</body>
</html>
